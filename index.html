<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platforma Handlowa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input, textarea{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:5px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#chat-box{
height:200px;
background:black;
overflow:auto;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.message{
background:#334155;
padding:10px;
margin-top:10px;
border-radius:5px;
}

#homePage{
display:none;
}

#otpBox{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout-btn{
background:red;
width:auto;
padding:10px 20px;
}

</style>
</head>

<body>

<div class="container">

<!-- STRONA LOGOWANIA -->

<div id="loginPage" class="card">

<h1>Zaloguj się</h1>

<input type="text" id="phone" placeholder="Wpisz numer telefonu">

<button onclick="sendOTP()">Wyślij kod OTP</button>

<div id="otpBox">

<h3 style="margin-top:20px;">Kod OTP</h3>

<input type="text" id="otpInput" placeholder="Wpisz kod OTP">

<p style="margin-top:10px;">
Twój kod OTP:
<span id="generatedOTP"></span>
</p>

<button onclick="verifyOTP()">Zweryfikuj OTP</button>

</div>

</div>

<!-- STRONA GŁÓWNA -->

<div id="homePage">

<div class="topbar">

<h2>Platforma Inwestycyjna</h2>

<button class="logout-btn" onclick="logoutUser()">
Wyloguj
</button>

</div>

<div class="card">

<h2>Saldo Konta</h2>

<h1>$0.00</h1>

<h3 style="margin-top:20px;">Doładuj Portfel</h3>

<p>Wyślij płatność na:</p>

<notextarea rows="4">
TWÓJ ADRES TRUST WALLET
Aby zasilić adres swojego portfela
0xc7F7FeA10C7766a80d8c5e03A65679297BC77e09
</textarea>

</div>

<div class="card">

<h2>Czat Handlowy na Żywo</h2>

<div id="chat-box"></div>

<input type="text" id="message" placeholder="Napisz wiadomość">

<button onclick="sendMessage()">
Wyślij wiadomość
</button>

</div>

</div>

</div>

<script>

let currentOTP = "";

// SPRAWDŹ LOGOWANIE

window.onload = function(){

let loggedIn = localStorage.getItem("loggedIn");

if(loggedIn === "true"){

showHomePage();

}

};

// WYŚLIJ OTP

function sendOTP(){

let phone = document.getElementById("phone").value;

if(phone === ""){

alert("Wpisz numer telefonu");

return;

}

currentOTP = Math.floor(1000 + Math.random() * 9000);

document.getElementById("generatedOTP").innerText = currentOTP;

document.getElementById("otpBox").style.display = "block";

}

// WERYFIKUJ OTP

function verifyOTP(){

let otpInput = document.getElementById("otpInput").value;

if(otpInput == currentOTP){

localStorage.setItem("loggedIn", "true");

showHomePage();

}else{

alert("Nieprawidłowy kod OTP");

}

}

// POKAŻ STRONĘ GŁÓWNĄ

function showHomePage(){

document.getElementById("loginPage").style.display = "none";

document.getElementById("homePage").style.display = "block";

}

// WYLOGUJ

function logoutUser(){

localStorage.removeItem("loggedIn");

location.reload();

}

// SYSTEM CZATU

function sendMessage(){

let message = document.getElementById("message").value;

if(message === "") return;

let chatBox = document.getElementById("chat-box");

let div = document.createElement("div");

div.classList.add("message");

div.innerText = message;

chatBox.appendChild(div);

document.getElementById("message").value = "";

chatBox.scrollTop = chatBox.scrollHeight;

}

</script>

</body>
</html>
